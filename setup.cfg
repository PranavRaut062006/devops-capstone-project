[nosetests]
verbosity=2
with-spec=1
spec-color=1
with-coverage=1
cover-package=service
cover-erase=1

[coverage:run]
branch = True
source = service

[coverage:report]
show_missing = True
fail_under = 80
skip_covered = True

[flake8]
per-file-ignores =
    */__init__.py: F401 E402
max-line-length = 127
statistics = True
exclude = .git,__pycache__,.venv,venv

[pylint.'MESSAGES CONTROL']
disable=E1101,too-few-public-methods,too-many-arguments
